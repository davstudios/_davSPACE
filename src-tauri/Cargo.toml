[package]
name = "davspace"
version = "26.10.1"
description = "_davSPACE — local disk space analyzer by _davstudios."
authors = ["_davstudios"]
license = "MIT"
homepage = "https://davstudios.it"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "davspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
